<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 48" role="img" aria-label="SK Solutions Professional Paint Services">
  <!-- House mark: colorful paint-chip roof + body -->
  <!-- Left roof: magenta -->
  <polygon points="2,22 21,2 21,22" fill="#E8189A"/>
  <!-- Right roof: deep purple -->
  <polygon points="21,2 40,22 21,22" fill="#4B2D8F"/>
  <!-- Blue left column -->
  <rect x="4"  y="22" width="10" height="22" fill="#2070B8"/>
  <!-- Teal top center -->
  <rect x="14" y="22" width="12" height="11" fill="#00A89D"/>
  <!-- White window cutout -->
  <rect x="17" y="25" width="6"  height="5"  fill="#FFFFFF"/>
  <!-- Green bottom center -->
  <rect x="14" y="33" width="12" height="11" fill="#5BBB47"/>
  <!-- Yellow top right -->
  <rect x="26" y="22" width="12" height="11" fill="#E8B400"/>
  <!-- Orange-red bottom right -->
  <rect x="26" y="33" width="12" height="11" fill="#E84A1A"/>

  <!-- Vertical divider between icon and text -->
  <line x1="48" y1="8" x2="48" y2="40" stroke="#D0C8EC" stroke-width="1"/>

  <!-- SK wordmark -->
  <text x="56" y="29" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="#1A1A1A">SK</text>
  <!-- SOLUTIONS -->
  <text x="88" y="29" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="#1A1A1A">SOLUTIONS</text>
  <!-- Tagline -->
  <text x="56" y="43" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="9.5" fill="#928FAA" letter-spacing="0.5">Professional Paint Services</text>
</svg>
